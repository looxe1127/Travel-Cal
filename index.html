    <script type="module">

    <style>

<body>
<div class="card">
    <h1>🧳 旅行夾錢計數機</h1>
    <div class="trip-id-area">
        <input type="text" id="tripIdInput" placeholder="旅程代碼 (例如: tokyo2024)" enterkeyhint="done">
        <button onclick="changeTripId()">載入旅程</button>
    </div>
    <div class="sub">
        <span id="tripDisplay">📌 旅程: default</span>
        <span id="syncStatus" class="sync-badge">✅ 已同步</span>
    </div>
    <label>👥 團友名單 (用逗號分隔)</label>
    <input type="text" id="memberInput" placeholder="例如: A, B, C, D" value="A, B, C, D">
    <div class="form-grid" style="margin-top: 10px;">
        <div><label>📅 出發日期</label><input type="date" id="tripStartDate"></div>
        <div><label>📅 結束日期</label><input type="date" id="tripEndDate"></div>
    </div>
    <label style="margin-top: 10px;">💰 基本貨幣</label>
    <select id="currencySelect">
        <option value="HKD">HKD 港幣</option>
        <option value="TWD">TWD 台幣</option>
        <option value="JPY">JPY 日圓</option>
        <option value="KRW">KRW 韓元</option>
        <option value="USD">USD 美元</option>
    </select>
    <button onclick="updateMemberList()">更新設定</button>
</div>

<div class="card" id="expenseFormCard">
    <h2 style="margin-top: 0;" id="formTitle">➕ 新增消費</h2>
    <div class="form-grid">
        <div><label>💰 邊個俾錢？</label><select id="payerSelect"></select></div>
        <div><label>💵 金額</label><input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0" onchange="updateSplitPreview()" onkeyup="updateSplitPreview()"></div>
    </div>
    <div class="form-grid">
        <div><label>📅 消費日期</label><input type="date" id="expenseDate"></div>
        <div><label>🏷️ 類別</label><select id="categorySelect"><option value="餐飲">🍽️ 餐飲</option><option value="交通">🚗 交通</option><option value="住宿">🏨 住宿</option><option value="景點">🎟️ 景點</option><option value="購物">🛍️ 購物</option><option value="便利店">🏪 便利店</option><option value="其他">📦 其他</option></select></div>
    </div>
    <div class="form-grid">
        <div><label>💳 付款方式</label><select id="paymentMethodSelect" onchange="toggleOtherPaymentInput()"><option value="現金" selected>💵 現金</option><option value="信用卡">💳 信用卡</option><option value="其他">✏️ 其他</option></select></div>
        <div id="otherPaymentContainer" style="display: none;"><label>📝 其他付款方式</label><input type="text" id="otherPaymentInput" placeholder="例如: PayMe, 八達通"></div>
    </div>
    <label>📝 描述</label>
    <input type="text" id="descInput" placeholder="例如: 機場快線車票">
    <label>👤 分賬方式</label>
    <div class="split-mode-tabs">
        <button id="equalModeBtn" class="active" onclick="setSplitMode('equal')">⚖️ 平均分</button>
        <button id="customModeBtn" onclick="setSplitMode('custom')">✏️ 自訂金額</button>
    </div>
    <div id="splitArea"></div>
    <div id="splitTotalHint" class="total-hint"></div>
    <button onclick="saveExpense()" id="saveExpenseBtn">➕ 新增消費記錄</button>
    <button class="secondary cancel-edit-btn" id="cancelEditBtn" onclick="cancelEdit()" style="display: none;">取消編輯</button>
    <hr>
    <div class="filter-bar">
        <select id="filterCategory" onchange="renderExpenseList()"><option value="全部">全部類別</option><option value="餐飲">餐飲</option><option value="交通">交通</option><option value="住宿">住宿</option><option value="景點">景點</option><option value="購物">購物</option><option value="便利店">便利店</option><option value="其他">其他</option></select>
        <select id="filterPayer" onchange="renderExpenseList()"><option value="全部">全部付款人</option></select>
        <select id="filterDate" onchange="renderExpenseList()"><option value="全部">全部日期</option></select>
        <button class="secondary small" onclick="resetFilter()">清除篩選</button>
    </div>
    <div id="expenseList"></div>
</div>

<div class="card">
    <div class="btn-group">
        <button onclick="generateFullReport()">📊 生成完整總結表</button>
        <button class="secondary" onclick="exportToExcel()">📥 匯出 Excel</button>
        <button class="secondary" onclick="resetExpenses()">🔄 重設消費</button>
    </div>
    <div class="advanced-menu">
        <button class="outline small" onclick="exportBackup()">💾 匯出備份</button>
        <button class="outline small" onclick="document.getElementById('importFileInput').click()">📂 匯入備份</button>
        <button class="outline small" onclick="clearAllData()" style="color: #c62828; border-color: #c62828;">🗑️ 清除全部</button>
    </div>
    <input type="file" id="importFileInput" accept=".json,application/json" onchange="importBackup(event)">
    <div id="resultArea" style="margin-top: 20px;"></div>
</div>

<!-- 匯率 Modal -->
<div class="modal-overlay" id="exchangeRateModal">
    <div class="modal">
        <h3>💱 輸入匯率（選填）</h3>
        <p style="font-size:14px;color:#666;">用於將 <span id="baseCurrencyLabel">HKD</span> 換算成 <span id="targetCurrencyLabel">HKD</span></p>
        <select id="exchangeDirection" onchange="updateExchangeHint()" style="width:auto; flex:1;">
            <option id="dirOption1" value="1">1 HKD = ? HKD</option>
            <option id="dirOption2" value="2">1 HKD = ? HKD</option>
        </select>
        <input type="number" id="exchangeRateInput" placeholder="例如: 0.052" step="any" min="0">
        <div id="exchangePreview" style="font-size:14px; color:#333; margin: 8px 0;"></div>
        <div class="modal-actions">
            <button onclick="applyExchangeRate()" class="small">✅ 確定</button>
            <button onclick="skipExchangeRate()" class="small secondary">跳過</button>
        </div>
    </div>
</div>

<script>
    // ========== 全域變數 ==========
    let db = null; let firebaseReady = false; let currentTripId = 'default';
    let members = ['A', 'B', 'C', 'D']; let expenses = []; let currentSplitMode = 'equal'; let customAmounts = {}; let editingExpenseId = null; let settledTransactions = {};
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('expenseDate').value = today;

    function getSavedTripId() { const p = new URLSearchParams(window.location.search); return p.get('trip') || localStorage.getItem('lastTripId') || 'default'; }
    function saveTripId(id) { localStorage.setItem('lastTripId', id); }
    currentTripId = getSavedTripId();
    document.getElementById('tripIdInput').value = currentTripId;
    document.getElementById('tripDisplay').innerHTML = `📌 旅程: ${currentTripId}`;

    const checkFirebase = setInterval(() => { if (window.firebaseReady && window.db) { db = window.db; firebaseReady = true; clearInterval(checkFirebase); initFirestoreSync(); } }, 100);

    function changeTripId() { const newId = document.getElementById('tripIdInput').value.trim(); if (!newId) { alert('請輸入旅程代碼'); return; } currentTripId = newId; saveTripId(currentTripId); document.getElementById('tripDisplay').innerHTML = `📌 旅程: ${currentTripId}`; settledTransactions = {}; initFirestoreSync(); }

    let unsubscribeExpenses, unsubscribeSettings, unsubscribeSettled;
    function initFirestoreSync() {
        if (!db) return;
        if (unsubscribeExpenses) unsubscribeExpenses();
        if (unsubscribeSettings) unsubscribeSettings();
        if (unsubscribeSettled) unsubscribeSettled();
        const { collection, doc, onSnapshot } = window.firebaseHelpers;
        unsubscribeExpenses = onSnapshot(collection(db, 'trips', currentTripId, 'expenses'), (snap) => { expenses = []; snap.forEach(d => expenses.push({...d.data(), id: d.id})); updateFilterDate(); renderExpenseList(); if (document.getElementById('resultArea').innerHTML) generateFullReport(); updateSyncStatus(false); });
        unsubscribeSettings = onSnapshot(doc(db, 'trips', currentTripId, 'settings', 'config'), (snap) => {
            if (snap.exists()) { const d = snap.data(); if (d.members) { members = d.members; document.getElementById('memberInput').value = members.join(', '); } document.getElementById('tripStartDate').value = d.tripStartDate || today; document.getElementById('tripEndDate').value = d.tripEndDate || new Date(Date.now()+7*24*60*60*1000).toISOString().split('T')[0]; if (d.currency) document.getElementById('currencySelect').value = d.currency; renderUI(); }
            else { document.getElementById('tripStartDate').value = today; document.getElementById('tripEndDate').value = new Date(Date.now()+7*24*60*60*1000).toISOString().split('T')[0]; saveSettings(); }
            updateSyncStatus(false);
        });
        unsubscribeSettled = onSnapshot(doc(db, 'trips', currentTripId, 'settings', 'settled'), (snap) => { settledTransactions = snap.exists() ? snap.data().transactions || {} : {}; if (document.getElementById('resultArea').innerHTML) generateFullReport(); });
    }

    function updateSyncStatus(s) { const b = document.getElementById('syncStatus'); b.className = 'sync-badge' + (s ? ' syncing' : ''); b.innerHTML = s ? '☁️ 同步中...' : '✅ 已同步'; }

    // ========== DEBUG 版本儲存功能 ==========
    async function saveExpenseToFirestore(ed) {
        if (!db) { alert('❌ 未連接 Firebase'); return; }
        updateSyncStatus(true);
        const id = ed.id || Date.now() + '-' + Math.random().toString(36);
        try {
            await setDoc(doc(db, 'trips', currentTripId, 'expenses', id), { ...ed, id });
            await setDoc(doc(db, 'trips', currentTripId, 'settings', 'settled'), { transactions: {} });
            updateSyncStatus(false);
        } catch (e) {
            console.error('儲存失敗:', e);
            updateSyncStatus(false);
            alert('❌ 儲存失敗: ' + (e.message || e));
        }
    }

    async function deleteExpenseFromFirestore(id) { if (!db) return; updateSyncStatus(true); try { await deleteDoc(doc(db, 'trips', currentTripId, 'expenses', id)); } catch(e) {} }

    async function saveSettings() {
        if (!db) { alert('❌ 未連接 Firebase'); return; }
        updateSyncStatus(true);
        const data = {
            members,
            tripStartDate: document.getElementById('tripStartDate').value,
            tripEndDate: document.getElementById('tripEndDate').value,
            currency: document.getElementById('currencySelect').value
        };
        try {
            await setDoc(doc(db, 'trips', currentTripId, 'settings', 'config'), data);
            updateSyncStatus(false);
            alert('✅ 設定已儲存');
        } catch (e) {
            console.error('設定儲存失敗:', e);
            updateSyncStatus(false);
            alert('❌ 儲存失敗: ' + (e.message || e));
        }
    }

    async function clearAllFirestoreData() { if (!db) return; const { collection, getDocs, writeBatch, doc } = window.firebaseHelpers; const batch = writeBatch(db); const snap = await getDocs(collection(db, 'trips', currentTripId, 'expenses')); snap.forEach(d => batch.delete(d.ref)); batch.delete(doc(db, 'trips', currentTripId, 'settings', 'config')); batch.delete(doc(db, 'trips', currentTripId, 'settings', 'settled')); await batch.commit(); }

    function renderUI() { updateMemberSelect(); updateFilterPayer(); renderSplitArea(); renderExpenseList(); }
    function updateMemberList() { const v = document.getElementById('memberInput').value; members = v.split(',').map(s=>s.trim()).filter(s=>s); if (!members.length) members = ['A','B','C','D']; saveSettings(); renderUI(); }
    function updateMemberSelect() { const s = document.getElementById('payerSelect'); s.innerHTML = ''; members.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; s.appendChild(o); }); }
    function updateFilterPayer() { const s = document.getElementById('filterPayer'); s.innerHTML = '<option value="全部">全部付款人</option>'; members.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; s.appendChild(o); }); }

    function saveExpense() {

        const desc = document.getElementById('descInput').value || '消費'; const date = document.getElementById('expenseDate').value;

        else { let tc=0; members.forEach(m=>{ const v=customAmounts[m]||0; if(v>0){ sharedWith.push(m); splitDetails[m]=v; tc+=v; } }); if (!sharedWith.length) { alert('請至少為一位團友輸入大於0嘅金額'); return; } if (Math.abs(tc-amount)>0.01) { alert(`自訂金額總計 ${currency} $${tc.toFixed(2)} 同總金額不符，請調整`); return; } }
        saveExpenseToFirestore({ payer, amount, desc, date, category, currency, paymentMethod, sharedWith, splitDetails, splitMode: currentSplitMode, id: editingExpenseId || Date.now()+'-'+Math.random().toString(36) });
        cancelEdit();
    }

    function editExpense(id) { const e = expenses.find(x=>x.id===id); if (!e) return; editingExpenseId = id; document.getElementById('payerSelect').value = e.payer; document.getElementById('amountInput').value = e.amount; document.getElementById('expenseDate').value = e.date; document.getElementById('categorySelect').value = e.category; document.getElementById('descInput').value = e.desc; if (e.paymentMethod) { if (e.paymentMethod==='現金'||e.paymentMethod==='信用卡') document.getElementById('paymentMethodSelect').value = e.paymentMethod; else { document.getElementById('paymentMethodSelect').value='其他'; document.getElementById('otherPaymentInput').value=e.paymentMethod; } } else document.getElementById('paymentMethodSelect').value='現金'; toggleOtherPaymentInput(); currentSplitMode = e.splitMode; setSplitMode(currentSplitMode); if (e.splitMode==='custom') customAmounts = {...e.splitDetails}; document.getElementById('formTitle').innerHTML = '✏️ 編輯消費'; document.getElementById('saveExpenseBtn').innerHTML = '💾 儲存修改'; document.getElementById('cancelEditBtn').style.display='block'; document.getElementById('expenseFormCard').classList.add('editing-mode'); renderSplitArea(); document.getElementById('expenseFormCard').scrollIntoView({behavior:'smooth'}); }

    function generateFullReport() { if (!expenses.length) { alert('請先新增消費記錄'); return; } showExchangeModal(rate => _generateFullReport(rate)); }
    function _generateFullReport(exchangeRate) {
        const currency = expenses[0].currency; const balance = {}; members.forEach(m=>balance[m]=0);
        const categoryTotal={}, dailyTotal={};
        expenses.forEach(e => { balance[e.payer] += e.amount; e.sharedWith.forEach(p=>balance[p]-=e.splitDetails[p]); categoryTotal[e.category] = (categoryTotal[e.category]||0)+e.amount; dailyTotal[e.date] = (dailyTotal[e.date]||0)+e.amount; });
        const totalExpense = Object.values(categoryTotal).reduce((a,b)=>a+b,0);
        const creditors=[], debtors=[]; members.forEach(m=>{ const b=balance[m]; if (Math.abs(b)<0.001) balance[m]=0; else if (b>0) creditors.push({name:m,amount:b}); else if (b<0) debtors.push({name:m,amount:-b}); }); creditors.sort((a,b)=>b.amount-a.amount); debtors.sort((a,b)=>b.amount-a.amount);
        const transactions=[]; let i=0,j=0; while(i<debtors.length&&j<creditors.length){ const d=debtors[i],c=creditors[j]; const amt=Math.min(d.amount,c.amount); transactions.push({from:d.name,to:c.name,amount:amt}); d.amount-=amt; c.amount-=amt; if(d.amount<0.001)i++; if(c.amount<0.001)j++; }
        const fmt = v => exchangeRate ? `${currency} $${v.toFixed(2)} (≈ HKD $${(v*exchangeRate).toFixed(2)})` : `${currency} $${v.toFixed(2)}`;
        const resultDiv = document.getElementById('resultArea');
        let html = `<div class="summary-box"><h3 style="margin-top:0;color:white;">📊 旅行消費總覽${exchangeRate?' (已換算)':''}</h3><div class="summary-row"><span>總消費金額</span><span style="font-size:24px;font-weight:bold;">${fmt(totalExpense)}</span></div><div class="summary-row"><span>旅程日期</span><span>${document.getElementById('tripStartDate').value} 至 ${document.getElementById('tripEndDate').value}</span></div><div class="summary-row"><span>團友人數</span><span>${members.length} 人</span></div></div><h3>📈 消費類別分析</h3>`;
        const colors = { '餐飲':'#FF9800','交通':'#03A9F4','住宿':'#4CAF50','景點':'#9C27B0','購物':'#F44336','便利店':'#795548','其他':'#9E9E9E' };
        Object.entries(categoryTotal).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt])=>{ const pct=(amt/totalExpense*100).toFixed(1); html += `<div class="category-stat"><span style="min-width:60px;">${cat}</span><div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${colors[cat]};"></div></div><span style="min-width:100px;text-align:right;">${fmt(amt)} (${pct}%)</span></div>`; });
        html += `<h3>👤 個人結餘總表</h3><div class="table-wrapper"><table><tr><th>團友</th><th>總墊付</th><th>總消費</th><th>結餘</th></tr>`;
        members.forEach(m=>{ const paid=expenses.filter(e=>e.payer===m).reduce((s,e)=>s+e.amount,0); const consumed=expenses.reduce((s,e)=>s+(e.splitDetails[m]||0),0); const bal=balance[m]; const status=bal>0?'收錢':bal<0?'俾錢':'無數'; html += `<tr><td><strong>${m}</strong></td><td>${fmt(paid)}</td><td>${fmt(consumed)}</td><td class="${bal>=0?'balance-positive':'balance-negative'}">${status} ${fmt(Math.abs(bal))}</td></tr>`; });
        html += `</table></div><h3>💸 最簡還款方案</h3>`;
        const unsettled = transactions.filter(t=>!settledTransactions[`${t.from}|${t.to}`]);
        if (!unsettled.length) html += '<p style="color:#2e7d32;padding:20px;text-align:center;">✅ 大家已經無數找！</p>';
        else { html += '<div class="table-wrapper"><table><tr><th>付款人</th><th>金額</th><th>收款人</th><th>動作</th></tr>'; unsettled.forEach(t=>{ html += `<tr><td><strong>${t.from}</strong></td><td>${fmt(t.amount)}</td><td><strong>${t.to}</strong></td><td><button class="settle-btn" onclick="markTransactionSettled('${t.from}','${t.to}')">✅ 已找數</button></td></tr>`; }); html += '</table></div>'; }
        html += `<h3>📅 每日消費趨勢</h3><div class="table-wrapper"><table><tr><th>日期</th><th>消費筆數</th><th>總金額</th></tr>`;
        Object.entries(dailyTotal).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([date,amt])=>{ html += `<tr><td>${date}</td><td>${expenses.filter(e=>e.date===date).length} 筆</td><td>${fmt(amt)}</td></tr>`; });
        html += '</table></div>'; resultDiv.innerHTML = html; resultDiv.scrollIntoView({behavior:'smooth'});
    }

    function resetExpenses() { if (confirm('確定要重設所有消費記錄嗎？\n\n團友名單同日期設定會保留。')) { clearAllFirestoreData().then(()=>{ document.getElementById('resultArea').innerHTML=''; customAmounts={}; cancelEdit(); }); } }
    async function clearAllData() { if (confirm('確定要清除全部資料嗎？\n\n所有消費記錄、團友名單、日期同貨幣設定都會被刪除。\n\n呢個動作唔可以還原！')) { await clearAllFirestoreData(); members=['A','B','C','D']; document.getElementById('memberInput').value='A, B, C, D'; document.getElementById('tripStartDate').value=today; document.getElementById('tripEndDate').value=new Date(Date.now()+7*24*60*60*1000).toISOString().split('T')[0]; document.getElementById('currencySelect').value='HKD'; document.getElementById('resultArea').innerHTML=''; cancelEdit(); saveSettings(); renderUI(); } }

    // ========== Excel 匯出 ==========
    function exportToExcel() { if (!expenses.length) { alert('未有資料'); return; } if (typeof XLSX==='undefined') { alert('Excel 組件載入中，請稍後再試'); return; } showExchangeModal(rate => _exportToExcel(rate)); }
    function _exportToExcel(exchangeRate) {
        const currency = expenses[0].currency; const wb = XLSX.utils.book_new();
        const fmtAmt = (v) => exchangeRate ? [`${currency} $${v.toFixed(2)}`, `HKD $${(v * exchangeRate).toFixed(2)}`] : [`${currency} $${v.toFixed(2)}`];
        const hdr = exchangeRate ? ['日期','類別','描述','付款人','金額','金額 (HKD)','付款方式','分賬方式','參與者','每人金額','每人金額 (HKD)'] : ['日期','類別','描述','付款人','金額','付款方式','分賬方式','參與者','每人金額'];
        const rowForExpense = (e) => { const splitBase = e.splitMode === 'equal' ? `平均分 (每人 ${e.currency} $${(e.amount / e.sharedWith.length).toFixed(2)})` : e.sharedWith.map(m => `${m}:${e.splitDetails[m].toFixed(2)}`).join('; '); const row = [e.date, e.category, e.desc, e.payer, ...fmtAmt(e.amount), e.paymentMethod || '現金', e.splitMode === 'equal' ? '平均分' : '自訂金額', e.sharedWith.join(', ')]; row.push(splitBase); if (exchangeRate) { const splitHkd = e.splitMode === 'equal' ? `平均分 (每人 HKD $${((e.amount / e.sharedWith.length) * exchangeRate).toFixed(2)})` : e.sharedWith.map(m => `${m}: HKD $${(e.splitDetails[m] * exchangeRate).toFixed(2)}`).join('; '); row.push(splitHkd); } return row; };
        const buildSheetData = (expenseList) => { if (!expenseList.length) return [hdr]; const sorted = [...expenseList].sort((a, b) => new Date(a.date) - new Date(b.date)); const data = [hdr]; let lastDate = ''; let totalAmount = 0; sorted.forEach(e => { if (e.date !== lastDate) { if (lastDate !== '') data.push([]); lastDate = e.date; } data.push(rowForExpense(e)); totalAmount += e.amount; }); const totalRow = ['', '', '', '總額', ...fmtAmt(totalAmount), '', '', '', '']; if (exchangeRate) totalRow.push(''); data.push([]); data.push(totalRow); return data; };
        const allExpenses = [...expenses]; const detailData = buildSheetData(allExpenses); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detailData), "消費明細");
        const dateGroups = {}; expenses.forEach(e => { if (!dateGroups[e.date]) dateGroups[e.date] = []; dateGroups[e.date].push(e); }); Object.keys(dateGroups).sort().forEach(date => { const dayData = buildSheetData(dateGroups[date]); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dayData), date); });
        const catGroups = {}; expenses.forEach(e => { if (!catGroups[e.category]) catGroups[e.category] = []; catGroups[e.category].push(e); }); Object.keys(catGroups).sort().forEach(cat => { const catData = buildSheetData(catGroups[cat]); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(catData), cat); });
        const bal = {}; members.forEach(m => bal[m] = 0); expenses.forEach(e => { bal[e.payer] += e.amount; e.sharedWith.forEach(p => bal[p] -= e.splitDetails[p]); });
        const sumHdr = exchangeRate ? ['團友', '總墊付', '總墊付 (HKD)', '總消費', '總消費 (HKD)', '結餘', '結餘 (HKD)', '狀態'] : ['團友', '總墊付', '總消費', '結餘', '狀態'];
        const sumData = [['個人結餘'], sumHdr];
        members.forEach(m => { const paid = expenses.filter(e => e.payer === m).reduce((s, e) => s + e.amount, 0); const consumed = expenses.reduce((s, e) => s + (e.splitDetails[m] || 0), 0); const b = bal[m]; if (exchangeRate) { sumData.push([m, ...fmtAmt(paid), ...fmtAmt(consumed), ...fmtAmt(Math.abs(b)), b > 0 ? '收錢' : b < 0 ? '俾錢' : '無數']); } else { sumData.push([m, ...fmtAmt(paid), ...fmtAmt(consumed), ...fmtAmt(Math.abs(b)), b > 0 ? '收錢' : b < 0 ? '俾錢' : '無數']); } });
        sumData.push([]); sumData.push(['還款方案']); const txnHdr = exchangeRate ? ['付款人', '金額', '金額 (HKD)', '收款人'] : ['付款人', '金額', '收款人']; sumData.push(txnHdr);
        const creditors = [], debtors = []; members.forEach(m => { const b = bal[m]; if (Math.abs(b) < 0.001) bal[m] = 0; else if (b > 0) creditors.push({ name: m, amount: b }); else if (b < 0) debtors.push({ name: m, amount: -b }); }); creditors.sort((a, b) => b.amount - a.amount); debtors.sort((a, b) => b.amount - a.amount);
        let ci = 0, di = 0; while (ci < creditors.length && di < debtors.length) { const c = creditors[ci], d = debtors[di]; const amt = Math.min(c.amount, d.amount); if (exchangeRate) sumData.push([d.name, ...fmtAmt(amt), c.name]); else sumData.push([d.name, ...fmtAmt(amt), c.name]); c.amount -= amt; d.amount -= amt; if (c.amount < 0.001) ci++; if (d.amount < 0.001) di++; }
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sumData), "個人結餘與還款");
        XLSX.writeFile(wb, `旅行分賬_${currentTripId}_${today}${exchangeRate ? '_已換算' : ''}.xlsx`);
    }

    function exportBackup() { const data = { tripId: currentTripId, members, expenses, tripStartDate: document.getElementById('tripStartDate').value, tripEndDate: document.getElementById('tripEndDate').value, currency: document.getElementById('currencySelect').value }; const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`旅行分賬備份_${currentTripId}_${today}.json`; a.click(); URL.revokeObjectURL(a.href); }
    async function importBackup(event) { const file=event.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=async(e)=>{ try{ const data=JSON.parse(e.target.result); if(data.members){ members=data.members; document.getElementById('memberInput').value=members.join(', '); } if(data.tripStartDate) document.getElementById('tripStartDate').value=data.tripStartDate; if(data.tripEndDate) document.getElementById('tripEndDate').value=data.tripEndDate; if(data.currency) document.getElementById('currencySelect').value=data.currency; await saveSettings(); if(data.expenses){ for(const exp of data.expenses){ await saveExpenseToFirestore({...exp, id: exp.id||Date.now()+'-'+Math.random().toString(36)}); } } cancelEdit(); renderUI(); alert('✅ 備份匯入成功！'); } catch(err){ alert('❌ 檔案格式錯誤'); } }; reader.readAsText(file); event.target.value=''; }

    renderUI();
    toggleOtherPaymentInput();
</script>
</body>
</html>
